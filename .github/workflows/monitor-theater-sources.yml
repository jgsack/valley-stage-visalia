name: Monitor theater sources

on:
  schedule:
    # Two UTC triggers keep the daily check resilient across Pacific daylight-saving changes.
    - cron: "15 9-13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: valley-stage-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Restore the previous source fingerprints
        uses: actions/cache@v4
        with:
          path: .cache/source-monitor-state.json
          key: valley-stage-source-monitor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            valley-stage-source-monitor-${{ runner.os }}-

      - name: Check official sources
        id: monitor
        run: >-
          node scripts/monitor-sources.mjs
          --state .cache/source-monitor-state.json
          --report source-monitor-report.json
          --markdown source-monitor-report.md
          --github-output "$GITHUB_OUTPUT"

      - name: Save the review report
        if: steps.monitor.outputs.requires_review == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: valley-stage-source-monitor-${{ github.run_id }}
          path: |
            source-monitor-report.json
            source-monitor-report.md
          retention-days: 14

      - name: Open or update the review issue
        if: steps.monitor.outputs.requires_review == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "[Automation] Valley Stage sources need review"
        run: |
          issue_number="$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number,title --jq ".[] | select(.title == env.ISSUE_TITLE) | .number" | head -n 1)"
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --body-file source-monitor-report.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file source-monitor-report.md
          fi

      - name: Record the completed daily check
        run: node scripts/record-daily-refresh.mjs

      - name: Commit the daily check date
        shell: bash
        run: |
          if git diff --quiet -- data/pilot-snapshot.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pilot-snapshot.json
          git commit -m "Record Valley Stage daily check"
          git push
